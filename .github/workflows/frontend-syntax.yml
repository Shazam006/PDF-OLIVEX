name: Frontend Syntax Check

on:
  push:
    branches: [main, "automacao/**", "fix/**"]
  pull_request:

jobs:
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: pip install pytest
      - name: Validate frontend JavaScript
        run: pytest -q tests/test_frontend_syntax.py
